<!DOCTYPE html>
<html>

<head>
	<title>CBSE Resources</title>


	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500&display=swap" rel="stylesheet">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.0/css/bootstrap.min.css">
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
	<script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.0/js/bootstrap.min.js"></script>
	<script src="https://www.gstatic.com/firebasejs/7.6.2/firebase-app.js"></script>
	<script src="https://www.gstatic.com/firebasejs/7.6.2/firebase-firestore.js"></script>
	<script src="https://www.gstatic.com/firebasejs/live/3.1/firebase.js"></script>
	<link rel="stylesheet" type="text/css" href="style_login.css">
	<link rel="icon" type="jpg" href="cbse.png">
	<script src="cbse.js"></script>
</head>

<body id="body1" class="prevent-select" style="background-color: white;">
	<center>
		<div class="container form-group" onclick="onclick">
			<div class="top"></div>
			<div class="bottom"></div>
			<div class="center">
				<h2 class="sub-text prevent-select">Please Sign In</h2>
				<input id="user_name" class="sub-text form-control prevent-select" type="username"
					placeholder="User name" />
				<input id="password_entry" class="form-control sub-text prevent-select" type="password"
					placeholder="Password" />
				<button id="login-button" class="btn btn-success prevent-select sub-text" onclick="addUser()"
					type="submit">Sign In</button>
			</div>
		</div>
		<div style="visibility: hidden;"> ~ </div>
		</div>

		<br><br>
		</div>
	</center>
</body>

</html>
